[package]
name = "gray-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Inject CLAUDE.md/AGENTS.md rule files into session start (port of pi's claude-rules)."

[[bin]]
name = "gray-rules"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
